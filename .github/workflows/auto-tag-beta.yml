name: Auto Tag Beta

# On every push to the Minecraft 26.1.2 upgrade branch:
#   1. Open a PR back to the default branch if one is not yet open.
#   2. Compute the next 26.1.2-beta.N tag (max existing + 1; first run = beta.1).
#   3. Sync build.gradle version, commit it back with [skip ci] so this
#      workflow does not loop on its own commit.
#   4. Build the spigot jar with the JDK 25 toolchain Paper 26.1+ requires.
#   5. Create the tag + GitHub Release and upload the spigot jar as an asset.

on:
  push:
    branches:
      - claude/minecraft-26.1.2-upgrade-dTYWZ

concurrency:
  group: auto-tag-beta-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure pull request exists
        env:
          GH_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.ref_name }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          existing=$(gh pr list --head "${HEAD_BRANCH}" --base "${BASE_BRANCH}" --state open --json number --jq 'length')
          if [ "${existing}" = "0" ]; then
            gh pr create \
              --base  "${BASE_BRANCH}" \
              --head  "${HEAD_BRANCH}" \
              --title "feat: add Minecraft 26.1.2 spigot support with auto beta-tag workflow" \
              --body  "$(printf '## Summary\n- Adds bukkit-helper-26-1-2 (cloned from bukkit-helper-121-11) using the Paper dev bundle 26.1.2.build.57-stable, with the renamed BlockState#getLightDampening() call.\n- Bumps io.papermc.paperweight.userdev to 2.0.0-beta.21 and adds foojay-resolver-convention 1.0.0 so the JDK 25 toolchain Paper 26.1+ requires is auto-provisioned.\n- Wires the new helper into spigot/build.gradle and routes every (MC: 26.x) server in Helper.java.\n- Sets project version to 26.1.2-beta.1.\n- Adds .github/workflows/auto-tag-beta.yml: every push computes 26.1.2-beta.N, syncs build.gradle, commits with [skip ci], builds the spigot jar and publishes a GitHub Release with the jar attached.\n\n## Test plan\n- [ ] Workflow tags 26.1.2-beta.1 and publishes a release on first push.\n- [ ] Subsequent pushes increment to beta.2, beta.3, ...\n- [ ] Plugin loads on a Paper 26.1.2 server.')"
          else
            echo "PR already open for ${HEAD_BRANCH} -> ${BASE_BRANCH}, skipping."
          fi

      - name: Compute next beta version
        id: next
        run: |
          set -euo pipefail
          git fetch --tags --force
          LAST=$(git tag --list '26.1.2-beta.*' \
            | sed -n 's/^26\.1\.2-beta\.\([0-9]\+\)$/\1/p' \
            | sort -n | tail -n 1)
          NEXT=$(( ${LAST:-0} + 1 ))
          TAG="26.1.2-beta.${NEXT}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Next tag: ${TAG}"

      - name: Sync build.gradle version
        run: |
          set -euo pipefail
          sed -i -E "s/^( *version *= *')[^']+(')/\1${{ steps.next.outputs.tag }}\2/" build.gradle
          grep -E "^ *version *= *'" build.gradle

      - name: Commit version bump
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- build.gradle; then
            git add build.gradle
            git commit -m "chore(release): bump version to ${TAG} [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "build.gradle already at ${TAG}; nothing to commit."
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Build spigot jar
        env:
          USERNAME:  ${{ secrets.USERNAME }}
          TOKEN:     ${{ secrets.TOKEN }}
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        # Run Gradle itself on JDK 21 (Shadow 9.x is happy there); the
        # paperweight subproject toolchain auto-uses JDK 25 via foojay.
        run: |
          ./gradlew :spigot:build \
            -Porg.gradle.java.installations.paths="${JAVA_HOME_25_X64},${JAVA_HOME_21_X64}"

      - name: Locate built jar
        id: jar
        run: |
          set -euo pipefail
          JAR_FILE=$(ls target/Dynmap-*-spigot.jar | tail -n 1)
          echo "path=${JAR_FILE}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${JAR_FILE}")" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG:      ${{ steps.next.outputs.tag }}
          JAR_PATH: ${{ steps.jar.outputs.path }}
        run: |
          set -euo pipefail
          # The version-bump push (if any) updated origin; re-resolve HEAD.
          git fetch origin "${GITHUB_REF_NAME}"
          SHA=$(git rev-parse "origin/${GITHUB_REF_NAME}")
          git tag "${TAG}" "${SHA}"
          git push origin "${TAG}"
          gh release create "${TAG}" \
            "${JAR_PATH}" \
            --title      "Dynmap ${TAG}" \
            --notes      "Automated beta build for Minecraft 26.1.2 from commit ${SHA}." \
            --prerelease \
            --target     "${SHA}"
