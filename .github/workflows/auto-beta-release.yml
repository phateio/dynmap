name: Auto Beta Release

# Each push to the upgrade branch produces a new release tagged
# 26.1.2-beta.<N>, where N auto-increments from the highest existing tag.

on:
  push:
    branches:
      - claude/minecraft-26.1.2-upgrade-6YV9K

concurrency:
  group: auto-beta-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute next beta version
        id: version
        run: |
          set -euo pipefail
          BASE="26.1.2-beta"
          git fetch --tags --force
          LAST=$(git tag --list "${BASE}.*" \
            | sed -E "s/^${BASE}\.([0-9]+)$/\1/" \
            | grep -E '^[0-9]+$' \
            | sort -n \
            | tail -n1 || true)
          if [ -z "${LAST}" ]; then
            NEXT=1
          else
            NEXT=$((LAST + 1))
          fi
          TAG="${BASE}.${NEXT}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Next tag: ${TAG}"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Build Spigot with BuildTools
        run: |
          mkdir -p buildtools
          cd buildtools
          wget -q https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar
          java -jar BuildTools.jar --rev 1.21.10 --remapped
          java -jar BuildTools.jar --rev 1.21.11 --remapped
          java -jar BuildTools.jar --rev 26.1.2 --remapped
          cd ..
        timeout-minutes: 60

      - name: Build with Gradle
        env:
          USERNAME: ${{ secrets.USERNAME }}
          TOKEN: ${{ secrets.TOKEN }}
        run: ./gradlew :spigot:build

      - name: Find JAR file
        id: find_jar
        run: |
          set -euo pipefail
          JAR_FILE=$(ls target/*.jar | grep 'spigot' | tail -n 1)
          echo "jar_file=${JAR_FILE}" >> "$GITHUB_OUTPUT"
          echo "jar_name=$(basename "${JAR_FILE}")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          JAR_FILE: ${{ steps.find_jar.outputs.jar_file }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" "${JAR_FILE}" \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --notes "Automated beta release for Minecraft 26.1.2 (commit ${GITHUB_SHA})." \
            --prerelease
