name: Auto Beta Release

on:
  push:
    branches:
      - 'claude/upgrade-26.1.2-beta-**'

permissions:
  contents: write
  pull-requests: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure pull request exists
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set +e
          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "${existing:-}" ]; then
            gh pr create \
              --head "$BRANCH" \
              --base "${{ github.event.repository.default_branch }}" \
              --title "feat: add Minecraft 26.1.2 support" \
              --body "Adds Dynmap support for Minecraft Java Edition 26.1.2.

- New \`bukkit-helper-26-1-2\` module (modeled on \`bukkit-helper-121-11\`).
- Toolchain bumped to JDK 25 for the new module (MC 26.1+ ships Java 25 bytecode).
- \`:remapped-mojang\` classifier dropped (26.1+ jars are mojang-mapped by default).
- API change: \`BlockState.getLightBlock()\` → \`getLightDampening()\`.
- Wired into \`settings.gradle\`, \`spigot/build.gradle\`, \`spigot/.../Helper.java\`.
- Bumped \`bukkit-helper-121-11\` to spigot \`1.21.11-R0.2-SNAPSHOT\` (BuildTools change).
- Bumped ASM to 9.8 so the shadow plugin can read Java 25 class files.
- Updated \`release.yml\` to install JDK 21 + 25 and run BuildTools for 26.1.2.
- Added \`auto-beta-release.yml\`: every push to this branch bumps the
  \`26.1.2-beta.N\` tag and creates a prerelease, which triggers \`release.yml\`
  to build and upload the spigot jar."
          else
            echo "PR already open: #$existing"
          fi

      - name: Determine next beta tag
        id: next_tag
        run: |
          set -euo pipefail
          BASE="26.1.2-beta"
          git fetch --tags --force
          # Find highest existing 26.1.2-beta.N
          HIGHEST=$(git tag -l "${BASE}.*" \
            | sed -n "s/^${BASE}\.\([0-9]\+\)$/\1/p" \
            | sort -n | tail -n 1 || true)
          if [ -z "${HIGHEST}" ]; then
            NEXT=1
          else
            NEXT=$((HIGHEST + 1))
          fi
          NEW_TAG="${BASE}.${NEXT}"
          echo "tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "Next tag: ${NEW_TAG}"

      - name: Create tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.next_tag.outputs.tag }}" -m "Release ${{ steps.next_tag.outputs.tag }}"
          git push origin "${{ steps.next_tag.outputs.tag }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.next_tag.outputs.tag }}" \
            --title "${{ steps.next_tag.outputs.tag }}" \
            --notes "Automated beta release for Minecraft 26.1.2 support. Built from commit ${{ github.sha }}." \
            --prerelease \
            --target "${{ github.sha }}"
