name: Release Build

on:
  release:
    types: [created]

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Build with Gradle
      env:
        USERNAME: ${{ secrets.USERNAME }}
        TOKEN: ${{ secrets.TOKEN }}
      run: ./gradlew :spigot:build

    - name: Upload Spigot JAR
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: target/Dynmap-${{ github.event.release.tag_name }}-spigot.jar
        asset_name: Dynmap-${{ github.event.release.tag_name }}-spigot.jar
        asset_content_type: application/java-archive
      continue-on-error: true

    - name: Find and upload all artifacts
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        UPLOAD_URL="${{ github.event.release.upload_url }}"
        UPLOAD_URL="${UPLOAD_URL%\{*}"

        for jar in target/*.jar; do
          if [ -f "$jar" ]; then
            FILENAME=$(basename "$jar")
            echo "Uploading $FILENAME..."

            curl -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/java-archive" \
              --data-binary "@$jar" \
              "${UPLOAD_URL}?name=${FILENAME}"
          fi
        done
