pluginManagement {
  repositories {
    gradlePluginPortal()
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://repo.papermc.io/repository/maven-public/" }
  }
}

plugins {
  // Apply paperweight.userdev to root project with 'apply false' for multi-project builds
  // See: https://docs.papermc.io/paper/dev/userdev/
  id 'io.papermc.paperweight.userdev' version '2.0.0-beta.21' apply false
  // Auto-download JDK toolchains; bukkit-helper-26-1-2 requires JDK 25
  // (Paper 26.1+ runtime), and not all CI runners have it preinstalled.
  id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'dynmap-common'

include ':spigot'
include ':bukkit-helper-113-2'
include ':bukkit-helper-114-1'
include ':bukkit-helper-115'
include ':bukkit-helper-116'
include ':bukkit-helper-116-2'
include ':bukkit-helper-116-3'
include ':bukkit-helper-116-4'
include ':bukkit-helper-117'
include ':bukkit-helper-118'
include ':bukkit-helper-118-2'
include ':bukkit-helper-119'
include ':bukkit-helper-119-3'
include ':bukkit-helper-119-4'
include ':bukkit-helper-120'
include ':bukkit-helper-120-2'
include ':bukkit-helper-120-4'
include ':bukkit-helper-120-5'
include ':bukkit-helper-121'
include ':bukkit-helper-121-3'
include ':bukkit-helper-121-4'
include ':bukkit-helper-121-5'
include ':bukkit-helper-121-6'
// bukkit-helper-121-10 uses BuildTools-style spigot dep (org.bukkit.craftbukkit.v1_21_R6)
// which paperweight's Mojang-mapped server jar does not provide. Disabled until the
// helper is rewritten to use reflection like bukkit-helper-121-11.
// include ':bukkit-helper-121-10'
include ':bukkit-helper-121-11'
include ':bukkit-helper-26-1-2'
include ':bukkit-helper'
include ':dynmap-api'
include ':DynmapCore'
include ':DynmapCoreAPI'
// Fabric/Forge modules are disabled because they rely on Gradle 8 APIs
// (archivesBaseName, archivePath, etc.) that Gradle 9 removed. Re-enable
// once Loom / ForgeGradle versions compatible with Gradle 9 are available.
