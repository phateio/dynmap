plugins {
    // Shadow 9.x for Gradle 9 compatibility
    id  "com.gradleup.shadow" version "9.0.0-beta4"
    id  'java'
    id  'maven-publish'
}

apply plugin: 'eclipse'

eclipse {
    project {
        name = "Dynmap"
    }
}

allprojects  {
  repositories {
     mavenLocal()
     maven { url 'https://libraries.minecraft.net/' }
     maven {
          url "https://maven.pkg.github.com/linktosriram/s3-lite"
          credentials {
              username = project.findProperty("gpr.user") ?: System.getenv("USERNAME")
              password = project.findProperty("gpr.key") ?: System.getenv("TOKEN")
          }
          content {
              includeGroup "io.github.linktosriram.s3lite"
          }
     }
     // PaperMC repository for paperweight dev-bundle (must be before other repos)
     maven { url "https://repo.papermc.io/repository/maven-public/" }
     maven { url "https://oss.sonatype.org/content/repositories/releases" }
     maven { url "https://oss.sonatype.org/content/repositories/snapshots" }
     maven { url "https://repo.mikeprimm.com" }
     maven { url "https://repo.maven.apache.org/maven2" }
     maven { url "https://hub.spigotmc.org/nexus/content/repositories/snapshots/" }
     maven { url "https://repo.codemc.org/repository/maven-public/" }
  }

  apply plugin: 'java'
  
  group = 'us.dynmap'
  version = '26.1.2-beta.6'

}

class Globals {
  String buildNumber =  System.getenv().BUILD_NUMBER ?: "Dev"
}
ext {
  globals = new Globals()
}

subprojects {
  apply plugin: "com.gradleup.shadow"
  apply plugin: 'java'
  apply plugin: 'maven-publish'

  // Set Java version - paperweight modules define their own Java version
  if (project.name != 'bukkit-helper-121-11' && project.name != 'bukkit-helper-121-10' && project.name != 'bukkit-helper-26-1-2') {
    java {
      sourceCompatibility = JavaVersion.VERSION_1_8
      targetCompatibility = JavaVersion.VERSION_1_8
    }
  }
  tasks.withType(JavaCompile) {
  	options.encoding = 'UTF-8'
  }
}

clean {
  delete "target" 
}

task setupCIWorkspace {
}
